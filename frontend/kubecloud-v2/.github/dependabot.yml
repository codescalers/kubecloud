# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.

version: 2
updates:
  # Configuration for your main Node.js/Yarn dependencies
  - package-ecosystem: "npm"
    # The directory where your package.json and yarn.lock files are located
    # Assuming they are in the root of your Nuxt project.
    directory: "/"
    # Check for updates daily
    schedule:
      interval: "daily"
      # You can specify a time (e.g., "05:00") and timezone for the checks
      # time: "05:00"
      # timezone: "Europe/London"

    # Group all non-major updates into a single PR for cleaner management
    groups:
      minor-patch:
        update-types:
          # Only include minor and patch version updates
          - minor
          - patch
        # Exclude development dependencies from this group to keep them separate
        # depends-on: development

    # Optional: Customize the PR creation
    labels:
      - "dependencies"
      - "yarn"
    # Optional: Set a PR limit to avoid too many open PRs at once
    open-pull-requests-limit: 10

    # Optional: Define reviewers/assignees for the PRs
    # reviewers:
    #   - "your-github-username"

    # Optional: Group related TypeScript packages
    # This feature ensures that the package and its corresponding @types package
    # are updated in the same PR, which is great for TypeScript projects.
    # Note: Dependabot generally handles @types sync automatically, but explicit grouping is an option.
    # groups:
    #   typescript:
    #     patterns:
    #       - "@types/*"
    #       - "typescript"
