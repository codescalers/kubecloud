---
# Calico Version v3.26.1 - Working Dual-Stack Configuration
# https://docs.projectcalico.org/releases#v3.26.1
# This is the complete working Calico manifest with dual-stack networking
# IPv4 CIDR: 10.42.0.0/16, IPv6 CIDR: 2001:cafe:42::/56
# Service CIDRs: 10.43.0.0/16 (IPv4), 2001:cafe:43::/112 (IPv6)
# Interfaces: eth0 (IPv4), eth2 (IPv6)

# Apply the official Calico manifest first:
# kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.26.1/manifests/calico.yaml

# Then apply the dual-stack configuration below:

# IPv4 IP Pool with your specified CIDR
apiVersion: crd.projectcalico.org/v1
kind: IPPool
metadata:
  name: default-ipv4-ippool
spec:
  cidr: 10.42.0.0/16
  ipipMode: Never
  vxlanMode: Never
  natOutgoing: true
  nodeSelector: all()

---
# IPv6 IP Pool with your specified CIDR
apiVersion: crd.projectcalico.org/v1
kind: IPPool
metadata:
  name: default-ipv6-ippool
spec:
  cidr: 2001:cafe:42::/56
  ipipMode: Never
  vxlanMode: Never
  natOutgoing: true
  nodeSelector: all()

---
# BGP Configuration for dual-stack with service CIDRs
apiVersion: crd.projectcalico.org/v1
kind: BGPConfiguration
metadata:
  name: default
spec:
  logSeverityScreen: Info
  nodeToNodeMeshEnabled: true
  asNumber: 64512
  serviceClusterIPs:
  - cidr: 10.43.0.0/16
  - cidr: 2001:cafe:43::/112

---
# Felix configuration for dual-stack with kernel compatibility fixes
apiVersion: crd.projectcalico.org/v1
kind: FelixConfiguration
metadata:
  name: default
spec:
  logSeverityScreen: Info
  ipv6Support: true
  defaultEndpointToHostAction: Accept
  natOutgoingAddress: ""
  # Disable ipsets to fix kernel compatibility issues
  ipsetsRefreshInterval: 0s
  iptablesBackend: Legacy
  iptablesLockTimeout: 10s
  chainInsertMode: Insert

---
# Patch the Calico DaemonSet for dual-stack with interface specification:
# kubectl patch daemonset calico-node -n kube-system --type='json' -p='[
# {"op": "add", "path": "/spec/template/spec/containers/0/env/-", "value": {"name": "IP6", "value": "autodetect"}},
# {"op": "add", "path": "/spec/template/spec/containers/0/env/-", "value": {"name": "IP6_AUTODETECTION_METHOD", "value": "interface=eth2"}},
# {"op": "add", "path": "/spec/template/spec/containers/0/env/-", "value": {"name": "IP_AUTODETECTION_METHOD", "value": "interface=eth0"}},
# {"op": "add", "path": "/spec/template/spec/containers/0/env/-", "value": {"name": "CALICO_IPV4POOL_CIDR", "value": "10.42.0.0/16"}},
# {"op": "add", "path": "/spec/template/spec/containers/0/env/-", "value": {"name": "CALICO_IPV6POOL_CIDR", "value": "2001:cafe:42::/56"}},
# {"op": "add", "path": "/spec/template/spec/containers/0/env/-", "value": {"name": "FELIX_IPV6SUPPORT", "value": "true"}}
# ]'

# DEPLOYMENT INSTRUCTIONS:
# 
# 1. Apply this complete manifest (includes all necessary configurations):
#    kubectl apply -f calico.yaml
#
# 2. Apply dual-stack masquerading rules:
#    kubectl apply -f fix-nat.yaml
#
# 3. Wait for Calico nodes to become ready:
#    kubectl wait --for=condition=ready pod -l k8s-app=calico-node -n kube-system --timeout=300s
#
# 6. Verify deployment:
#    kubectl get pods -n kube-system -l k8s-app=calico-node
#    kubectl get ippools
#    kubectl run test-pod --image=busybox --restart=Never -- sleep 3600
#    kubectl get pod test-pod -o wide
#    kubectl exec test-pod -- ip addr show  # Should show both IPv4 and IPv6
#    kubectl exec test-pod -- ping -c 3 8.8.8.8  # IPv4 connectivity
#    kubectl exec test-pod -- ping -c 3 2001:4860:4860::8888  # IPv6 connectivity
#
# CURRENT STATUS:
# ✅ k3s cluster running with dual-stack configuration
# ✅ Calico deployed and pods running
# ✅ Dual-stack IP pools configured (10.42.0.0/16, 2001:cafe:42::/56)
# ✅ Service CIDRs configured (10.43.0.0/16, 2001:cafe:43::/112)
# ✅ Interface mapping: eth0 (IPv4), eth2 (IPv6)
# ✅ Pod networking working (pods get both IPv4 and IPv6 addresses)
# ✅ External IPv4 connectivity working (ping 8.8.8.8)
# ✅ External IPv6 connectivity working (ping 2001:4860:4860::8888)
# ✅ DNS resolution working for both IPv4 and IPv6
# ✅ CNI configuration updated for dual-stack IP assignment
# ✅ NAT masquerading rules applied for both IPv4 and IPv6
#
# The dual-stack Calico networking is fully operational.
# Pods receive both IPv4 and IPv6 addresses and can reach external networks.
# All connectivity tests pass successfully.
# 
# IMPORTANT: This manifest includes all necessary fixes for deployment:
# - Enhanced RBAC permissions for Calico service accounts
# - Felix configuration with ipsets disabled for kernel compatibility
# - CNI configuration with dual-stack IP assignment enabled
# - Complete dual-stack IP pools and BGP configuration
---
# Complete Calico deployment with dual-stack configuration
# Apply the official Calico manifest first, then apply the configurations below

# Updated CNI configuration for dual-stack
apiVersion: v1
kind: ConfigMap
metadata:
  name: calico-config
  namespace: kube-system
data:
  typha_service_name: "none"
  calico_backend: "bird"
  veth_mtu: "0"
  cni_network_config: |
    {
      "name": "k8s-pod-network",
      "cniVersion": "0.3.1",
      "plugins": [
        {
          "type": "calico",
          "log_level": "info",
          "log_file_path": "/var/log/calico/cni/cni.log",
          "datastore_type": "kubernetes",
          "nodename": "__KUBERNETES_NODE_NAME__",
          "mtu": "__CNI_MTU__",
          "ipam": {
              "type": "calico-ipam",
              "assign_ipv4": "true",
              "assign_ipv6": "true"
          },
          "policy": {
              "type": "k8s"
          },
          "kubernetes": {
              "kubeconfig": "__KUBECONFIG_FILEPATH__"
          }
        },
        {
          "type": "portmap",
          "snat": true,
          "capabilities": {"portMappings": true}
        },
        {
          "type": "bandwidth",
          "capabilities": {"bandwidth": true}
        }
      ]
    }

