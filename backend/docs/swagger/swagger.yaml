info:
  contact: {}
  description: API documentation for Mycelium Cloud.
  title: Mycelium Cloud API
  version: "1.0"
paths:
  /deployments:
    delete:
      description: Deletes all deployments and their resources for the authenticated
        user
      produces:
      - application/json
      responses:
        "202":
          description: Delete all deployments workflow started successfully
          schema:
            allOf:
            - $ref: '#/definitions/handlers.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.DeploymentWorkflowResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete all deployments
      tags:
      - deployments
    get:
      description: Retrieves a list of all deployments (clusters) for the authenticated
        user
      produces:
      - application/json
      responses:
        "200":
          description: Deployments retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/handlers.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.DeploymentListResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.APIResponse'
      security:
      - BearerAuth: []
      summary: List deployments
      tags:
      - deployments
    post:
      consumes:
      - application/json
      description: Creates and deploys a new Kubernetes cluster
      parameters:
      - description: Cluster configuration
        in: body
        name: cluster
        required: true
        schema:
          $ref: '#/definitions/handlers.ClusterInput'
      produces:
      - application/json
      responses:
        "202":
          description: Deployment workflow started successfully
          schema:
            allOf:
            - $ref: '#/definitions/handlers.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.DeploymentWorkflowResponse'
              type: object
        "400":
          description: Invalid request format
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.APIResponse'
      security:
      - BearerAuth: []
      summary: Deploy cluster
      tags:
      - deployments
  /deployments/{name}:
    delete:
      description: Deletes a specific deployment and all its resources
      parameters:
      - description: Deployment name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Deployment deletion workflow started successfully
          schema:
            allOf:
            - $ref: '#/definitions/handlers.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.DeploymentWorkflowResponse'
              type: object
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "404":
          description: Deployment not found
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete deployment
      tags:
      - deployments
    get:
      description: Retrieves details of a specific deployment by name
      parameters:
      - description: Deployment name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Deployment details retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/handlers.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/services.ClusterData'
              type: object
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "404":
          description: Deployment not found
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.APIResponse'
      security:
      - BearerAuth: []
      summary: Get deployment
      tags:
      - deployments
  /deployments/{name}/kubeconfig:
    get:
      description: Retrieves the kubeconfig file for a specific deployment
      parameters:
      - description: Deployment name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Kubeconfig retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/handlers.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.KubeconfigResponse'
              type: object
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "404":
          description: Deployment not found
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.APIResponse'
      security:
      - BearerAuth: []
      summary: Get kubeconfig
      tags:
      - deployments
  /deployments/{name}/nodes:
    post:
      consumes:
      - application/json
      description: Adds a new node to an existing deployment
      parameters:
      - description: Cluster configuration with new node
        in: body
        name: cluster
        required: true
        schema:
          $ref: '#/definitions/handlers.ClusterInput'
      produces:
      - application/json
      responses:
        "202":
          description: Node addition workflow started successfully
          schema:
            allOf:
            - $ref: '#/definitions/handlers.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.DeploymentWorkflowResponse'
              type: object
        "400":
          description: Invalid request format
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "404":
          description: Deployment not found
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.APIResponse'
      security:
      - BearerAuth: []
      summary: Add node to deployment
      tags:
      - deployments
  /deployments/{name}/nodes/{node_name}:
    delete:
      description: Removes a specific node from an existing deployment
      parameters:
      - description: Deployment name
        in: path
        name: name
        required: true
        type: string
      - description: Node name to remove
        in: path
        name: node_name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Node removal workflow started successfully
          schema:
            allOf:
            - $ref: '#/definitions/handlers.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.DeploymentWorkflowResponse'
              type: object
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "404":
          description: Deployment not found
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.APIResponse'
      security:
      - BearerAuth: []
      summary: Remove node from deployment
      tags:
      - deployments
  /invoices:
    get:
      consumes:
      - application/json
      description: Returns a list of all invoices
      operationId: get-all-invoices
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handlers.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.Invoice'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.APIResponse'
      security:
      - AdminMiddleware: []
      summary: Get all invoices
      tags:
      - admin
  /nodes:
    get:
      consumes:
      - application/json
      description: List all nodes from the grid proxy (no user-specific filtering)
      operationId: list-all-grid-nodes
      parameters:
      - description: 'Filter by healthy nodes (default: false)'
        in: query
        name: healthy
        type: boolean
      - description: 'Limit the number of nodes returned (default: 50)'
        in: query
        name: size
        type: integer
      - description: 'page number (default: 1)'
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: All grid nodes retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/handlers.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.ListNodesResponse'
              type: object
        "400":
          description: Invalid filter parameters
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.APIResponse'
      summary: List all grid nodes
      tags:
      - nodes
  /nodes/{node_id}/storage-pool:
    get:
      consumes:
      - application/json
      description: Returns node storage pool
      operationId: get-node-storage-pool
      parameters:
      - description: Node ID
        in: path
        name: node_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Node storage pool is retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/handlers.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.NodeStoragePoolResponse'
              type: object
        "400":
          description: Bad Request or Invalid params
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "404":
          description: Node not found
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.APIResponse'
      summary: Get node storage pool
      tags:
      - nodes
  /notifications:
    delete:
      consumes:
      - application/json
      description: Deletes all notifications for a user
      produces:
      - application/json
      responses:
        "200":
          description: All notifications deleted successfully
          schema:
            allOf:
            - $ref: '#/definitions/handlers.APIResponse'
            - properties:
                data:
                  type: object
              type: object
        "401":
          description: Authentication required
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "500":
          description: Failed to delete notifications
          schema:
            $ref: '#/definitions/handlers.APIResponse'
      summary: Delete all notifications
      tags:
      - notifications
    get:
      consumes:
      - application/json
      description: Retrieves all user notifications with pagination
      parameters:
      - description: 'Maximum number of notifications to return (default: 20, max:
          100)'
        in: query
        name: limit
        type: integer
      - description: 'Number of notifications to skip (default: 0)'
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Notifications retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/handlers.APIResponse'
            - properties:
                data:
                  properties:
                    count:
                      type: integer
                    limit:
                      type: integer
                    notifications:
                      items:
                        $ref: '#/definitions/handlers.NotificationResponse'
                      type: array
                    offset:
                      type: integer
                  type: object
              type: object
        "400":
          description: Invalid pagination parameters
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "500":
          description: Failed to retrieve notifications
          schema:
            $ref: '#/definitions/handlers.APIResponse'
      summary: Get all notifications
      tags:
      - notifications
  /notifications/{notification_id}:
    delete:
      consumes:
      - application/json
      description: Deletes a specific notification for a user
      parameters:
      - description: Notification ID
        in: path
        name: notification_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Notification deleted successfully
          schema:
            allOf:
            - $ref: '#/definitions/handlers.APIResponse'
            - properties:
                data:
                  type: object
              type: object
        "400":
          description: Invalid notification ID
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "401":
          description: Authentication required
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "404":
          description: Notification not found
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "500":
          description: Failed to delete notification
          schema:
            $ref: '#/definitions/handlers.APIResponse'
      summary: Delete a specific notification
      tags:
      - notifications
  /notifications/{notification_id}/read:
    patch:
      consumes:
      - application/json
      description: Marks a specific notification as read for a user
      parameters:
      - description: Notification ID
        in: path
        name: notification_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Notification marked as read successfully
          schema:
            allOf:
            - $ref: '#/definitions/handlers.APIResponse'
            - properties:
                data:
                  type: object
              type: object
        "400":
          description: Invalid notification ID
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "401":
          description: Authentication required
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "404":
          description: Notification not found
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "500":
          description: Failed to mark notification as read
          schema:
            $ref: '#/definitions/handlers.APIResponse'
      summary: Mark a specific notification as read
      tags:
      - notifications
  /notifications/{notification_id}/unread:
    patch:
      consumes:
      - application/json
      description: Marks a specific notification as unread for a user
      parameters:
      - description: Notification ID
        in: path
        name: notification_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Notification marked as unread successfully
          schema:
            allOf:
            - $ref: '#/definitions/handlers.APIResponse'
            - properties:
                data:
                  type: object
              type: object
        "400":
          description: Invalid notification ID
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "401":
          description: Authentication required
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "404":
          description: Notification not found
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "500":
          description: Failed to mark notification as unread
          schema:
            $ref: '#/definitions/handlers.APIResponse'
      summary: Mark a specific notification as unread
      tags:
      - notifications
  /notifications/read-all:
    patch:
      consumes:
      - application/json
      description: Marks all notifications as read for a user
      produces:
      - application/json
      responses:
        "200":
          description: All notifications marked as read successfully
          schema:
            allOf:
            - $ref: '#/definitions/handlers.APIResponse'
            - properties:
                data:
                  type: object
              type: object
        "400":
          description: Invalid notification ID
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "401":
          description: Authentication required
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "500":
          description: Failed to mark notifications as read
          schema:
            $ref: '#/definitions/handlers.APIResponse'
      summary: Mark all notifications as read
      tags:
      - notifications
  /notifications/unread:
    get:
      consumes:
      - application/json
      description: Retrieves only unread notifications for a user
      parameters:
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Unread notifications retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/handlers.APIResponse'
            - properties:
                data:
                  properties:
                    count:
                      type: integer
                    limit:
                      type: integer
                    notifications:
                      items:
                        $ref: '#/definitions/handlers.NotificationResponse'
                      type: array
                    offset:
                      type: integer
                  type: object
              type: object
        "400":
          description: Invalid pagination parameters
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "500":
          description: Failed to retrieve unread notifications
          schema:
            $ref: '#/definitions/handlers.APIResponse'
      summary: Get unread notifications
      tags:
      - notifications
  /pending-records:
    get:
      consumes:
      - application/json
      description: Returns all pending records in the system
      operationId: list-pending-records
      produces:
      - application/json
      responses:
        "200":
          description: Pending records are retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/handlers.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/services.PendingRecordsWithUSDAmounts'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.APIResponse'
      security:
      - AdminMiddleware: []
      summary: List pending records
      tags:
      - admin
  /stats:
    get:
      consumes:
      - application/json
      description: Retrieves comprehensive system statistics.
      operationId: get-stats
      produces:
      - application/json
      responses:
        "200":
          description: System statistics retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/handlers.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/services.Stats'
              type: object
        "500":
          description: Internal Server Error - Failed to retrieve statistics
          schema:
            $ref: '#/definitions/handlers.APIResponse'
      security:
      - AdminMiddleware: []
      summary: Get system statistics
      tags:
      - admin
  /system/maintenance/status:
    get:
      consumes:
      - application/json
      description: Gets maintenance mode for the system
      operationId: get-maintenance-mode
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handlers.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.MaintenanceModeStatus'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.APIResponse'
      security:
      - AdminMiddleware: []
      summary: Get maintenance mode
      tags:
      - admin
    put:
      consumes:
      - application/json
      description: Sets maintenance mode for the system
      operationId: set-maintenance-mode
      parameters:
      - description: Maintenance Mode Status
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.MaintenanceModeStatus'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.APIResponse'
      security:
      - AdminMiddleware: []
      summary: Set maintenance mode
      tags:
      - admin
  /twins/{twin_id}/account:
    get:
      consumes:
      - application/json
      description: Retrieve the account ID associated with a specific twin ID
      parameters:
      - description: Twin ID
        in: path
        name: twin_id
        required: true
        type: integer
      - description: Pagination limit
        in: query
        name: limit
        type: integer
      - description: Pagination offset
        in: query
        name: offset
        type: integer
      - description: Other optional filter params
        in: query
        name: filterParam
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Account ID is retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/handlers.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.TwinResponse'
              type: object
        "400":
          description: Bad Request or Invalid params
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "404":
          description: Twin ID not found
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.APIResponse'
      summary: Get account ID by twin ID
      tags:
      - twins
  /user/:
    get:
      description: Retrieves all data of the user
      operationId: get-user
      produces:
      - application/json
      responses:
        "200":
          description: User is retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/handlers.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/services.UserWithPendingBalance'
              type: object
        "404":
          description: User is not found
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.APIResponse'
      summary: Get user details
      tags:
      - users
  /user/balance:
    get:
      description: Retrieves the user's balance in USD
      operationId: get-user-balance
      produces:
      - application/json
      responses:
        "200":
          description: Balance fetched successfully
          schema:
            allOf:
            - $ref: '#/definitions/handlers.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.UserBalanceResponse'
              type: object
        "404":
          description: User is not found
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.APIResponse'
      summary: Get user balance
      tags:
      - users
  /user/balance/charge:
    post:
      consumes:
      - application/json
      description: Charges the user's balance using a payment method
      operationId: charge-balance
      parameters:
      - description: Charge Balance Input
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.ChargeBalanceInput'
      produces:
      - application/json
      responses:
        "202":
          description: 'workflow_id: string, email: string'
          schema:
            allOf:
            - $ref: '#/definitions/handlers.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.ChargeBalanceResponse'
              type: object
        "400":
          description: Invalid request format or amount
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "404":
          description: User is not found
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handlers.APIResponse'
      summary: Charge user balance
      tags:
      - users
  /user/change_password:
    put:
      consumes:
      - application/json
      description: Changes the user's password
      operationId: change-password
      parameters:
      - description: Change Password Input
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.ChangePasswordInput'
      produces:
      - application/json
      responses:
        "200":
          description: Password updated successfully
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "400":
          description: Invalid request format or password mismatch
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "404":
          description: User is not found
          schema:
            $ref: '#/definitions/handlers.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.APIResponse'
      summary: Change password
      tags:
      - users
  /user/forgot_password:
    post:
      consumes:
      - application/json
      description: Sends a verification code to the user's email for password reset
      operationId: forgot-password
      parameters:
      - description: Email Input
        in: body
        name: body
        required: true
        schema:
